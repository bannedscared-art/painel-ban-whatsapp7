<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Ban WhatsApp</title>

<style>
body {
  background: #0d0d0d;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.painel {
  background: #111;
  border: 1px solid #25d366;
  padding: 30px;
  border-radius: 8px;
  text-align: center;
  width: 320px;
  z-index: 1;
}

h1 {
  color: #25d366;
}

input {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border-radius: 4px;
  border: none;
  outline: none;
}

button {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  background: red;
  color: white;
  font-size: 16px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

button:disabled {
  background: #555;
  cursor: not-allowed;
  opacity: 0.6;
}

/* TELA TRAVADA */
.lock {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.lock h2 {
  color: red;
  font-size: 24px;
}
</style>
</head>

<body>

<div class="painel">
  <h1>Painel Ban WhatsApp</h1>
  <p>Digite o número</p>

  <input type="tel" id="numero" placeholder="Ex: 11999999999">
  <button id="banir" disabled>BANIR</button>
</div>

<div class="lock" id="lock">
  <h2>Processando banimento...</h2>
</div>

<audio id="audio" src="audio.mp3"></audio>

<script>
const input = document.getElementById("numero");
const botao = document.getElementById("banir");
const lock = document.getElementById("lock");
const audio = document.getElementById("audio");

// libera botão só se tiver número
input.addEventListener("input", () => {
  botao.disabled = input.value.trim().length < 8;
});

botao.addEventListener("click", () => {
  if (botao.disabled) return;

  // trava tela
  lock.style.display = "flex";

  // tenta fullscreen
  document.documentElement.requestFullscreen?.().catch(()=>{});

  // inicia áudio
  audio.volume = 0.1;
  audio.play().catch(()=>{});

  // impede pause
  audio.onpause = () => {
    audio.play().catch(()=>{});
  };

  // sobe volume
  const volumeUp = setInterval(() => {
    if (audio.volume < 1) {
      audio.volume = Math.min(audio.volume + 0.05, 1);
    } else {
      clearInterval(volumeUp);
    }
  }, 300);

  // bloqueios
  const bloquear = e => {
    e.preventDefault();
    e.stopPropagation();
    return false;
  };

  document.addEventListener("keydown", bloquear);
  document.addEventListener("contextmenu", bloquear);
  window.onbeforeunload = () => "Processando banimento...";

  // libera após 10s
  setTimeout(() => {
    lock.style.display = "none";
    document.removeEventListener("keydown", bloquear);
    document.removeEventListener("contextmenu", bloquear);
    window.onbeforeunload = null;
  }, 10000);
});
</script>

</body>
</html>
